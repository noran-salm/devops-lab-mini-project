
---
- name: Configure EC2 Instance with Docker
  hosts: webservers
  become: yes 
  
  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600 

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Start and enable the Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Add the SSH user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes 